<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สต็อกสินค้ามือถือ</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#0f1115; --card:#1a1d24; --line:#2a2e37; --text:#e8eaed; --sub:#9aa2ad;
  --accent:#4f8cff; --accent2:#3a6fd6;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f5f6f8; --card:#ffffff; --line:#e2e4e8; --text:#1c1f24; --sub:#5b626d; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
header{position:sticky;top:0;background:var(--bg);padding:14px 16px 8px;border-bottom:1px solid var(--line);z-index:5}
h1{font-size:18px;margin:0 0 10px}
.meta{font-size:12px;color:var(--sub)}
.uploadRow{display:flex;gap:8px;align-items:center;margin:10px 0;flex-wrap:wrap}
button,.filebtn{background:var(--accent);color:#fff;border:none;padding:9px 14px;border-radius:8px;font-size:14px;cursor:pointer}
button:active,.filebtn:active{background:var(--accent2)}
input[type=file]{display:none}
.brands{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--line)}
.chip{flex:0 0 auto;padding:7px 13px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:13px;cursor:pointer;white-space:nowrap}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.swatch{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;border:1px solid rgba(128,128,128,.4);vertical-align:middle}
.item .c .swatch{margin-right:5px}
.searchRow{padding:6px 16px 0}
.searchRow input{width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:14px}
select.brandSelect{width:100%;margin:2px 0;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--accent);color:#fff;font-size:14px;font-weight:600}
main{padding:12px 16px 40px;max-width:760px;margin:0 auto}
.cat{margin:16px 0 6px;font-size:13px;color:var(--sub);font-weight:600}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px}
.item .d{font-size:14px}
.item .c{font-size:11px;color:var(--sub);margin-top:2px}
.item .q{font-size:15px;font-weight:700;min-width:34px;text-align:right}
.empty{color:var(--sub);text-align:center;padding:40px 10px;font-size:14px}
.status{font-size:12px;color:var(--sub);padding:0 16px 8px}
</style>
</head>
<body>
<header>
  <h1>สต็อกสินค้ามือถือ</h1>
  <div class="uploadRow">
    <label class="filebtn" for="file">อัปโหลดไฟล์ใหม่</label>
    <input type="file" id="file" accept=".xlsx,.xls">
    <button id="clearBtn" style="background:#555">ล้างข้อมูล</button>
    <span class="meta" id="updatedMeta">ยังไม่มีข้อมูล</span>
  </div>
</header>
<div class="status" id="status">ข้อมูลถูกเก็บไว้ในเบราว์เซอร์นี้เท่านั้น (ไม่แชร์ข้ามเครื่อง/อุปกรณ์)</div>
<div class="searchRow"><input type="text" id="searchInput" placeholder="ค้นหาชื่อรุ่น..."></div>
<div class="brands"><select id="brandSelect" class="brandSelect"></select></div>
<div class="brands" id="colorsRow"></div>
<main id="main"><div class="empty">กำลังโหลดข้อมูล…</div></main>

<script>
const STORAGE_KEY = 'phoneStockData';
let currentData = { items: [], updatedAt: null, fileName: null };
let activeBrand = 'ทั้งหมด';
let activeColor = 'ทั้งหมด';
let searchTerm = '';

const aliases = [
  [/^IPH/i,'Apple'], [/^IPAD/i,'Apple'], [/^SS$/i,'Samsung'], [/^GALAXY/i,'Samsung'],
  [/^OPPO/i,'Oppo'], [/^VIVO/i,'Vivo'], [/^XIAOMI/i,'Xiaomi'], [/^REALME/i,'Realme'],
  [/^INFINIX/i,'Infinix'], [/^ALLDOCUBE/i,'Alldocube'], [/^HUAWEI/i,'Huawei'],
  [/^NOKIA/i,'Nokia'], [/^ITEL/i,'Itel'], [/^TECNO/i,'Tecno'], [/^ONEPLUS/i,'OnePlus']
];
function detectBrand(desc, category){
  const parts = String(desc||'').split(',').map(s=>s.trim()).filter(Boolean);
  let i=0;
  while(i<parts.length && ['H/S','ACC'].includes(parts[i].toUpperCase())) i++;
  const tok = parts[i] || category || 'อื่นๆ';
  for(const [re,name] of aliases) if(re.test(tok)) return name;
  return tok.charAt(0).toUpperCase()+tok.slice(1).toLowerCase();
}

const colors = [
  [/BLACK|^BK$/i,'ดำ','#1c1c1e'], [/WHITE|^WH$/i,'ขาว','#f2f2f2'],
  [/SILVER|^SL$/i,'เงิน','#c0c0c0'], [/GOLD|^GD$/i,'ทอง','#d4af37'],
  [/GRAY|GREY|^GY$/i,'เทา','#8e8e93'], [/BLUE|^BL$/i,'น้ำเงิน','#3a6fd6'],
  [/GREEN|^GN$/i,'เขียว','#2e8b57'], [/PINK|^PK$/i,'ชมพู','#ff8fb3'],
  [/PURPLE|VIOLET|^PP$/i,'ม่วง','#8e5bb5'], [/RED|^RD$/i,'แดง','#e0453c'],
  [/ORANGE|^OR$/i,'ส้ม','#e67e22'], [/NAVY|^NV$/i,'กรมท่า','#1b2a4a'],
  [/BEIGE/i,'เบจ','#d8c3a5'], [/BRONZE/i,'บรอนซ์','#8c6239'],
  [/TITANIUM/i,'ไทเทเนียม','#7c7c7c'], [/GRAPHITE/i,'กราไฟต์','#3b3b3b'],
  [/CREAM/i,'ครีม','#f5e6ca'], [/LAVENDER/i,'ลาเวนเดอร์','#c8a2c8'],
  [/MINT/i,'มินต์','#a8e6cf'], [/TEAL/i,'ทีล','#008080']
];
function detectColor(desc){
  const parts = String(desc||'').split(',').map(s=>s.trim()).filter(Boolean);
  for(let i=parts.length-1;i>=0;i--){
    for(const [re,name,hex] of colors) if(re.test(parts[i])) return {name,hex};
  }
  return null;
}

function parseWorkbook(wb){
  const items = [];
  let category = '';
  for(const sheetName of wb.SheetNames){
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {header:1, defval:null});
    for(const row of rows){
      const [a,b,c,d,e] = row;
      if(a!=null && typeof a === 'number' && c!=null && e==null){ category = String(c).trim(); continue; }
      if(a!=null && typeof a === 'string' && c!=null && e!=null){
        items.push({ code:a, branch:b, desc:String(c).trim(), qty:Number(e)||0, category, brand: detectBrand(c, category), color: detectColor(c) });
      }
    }
  }
  return items;
}

function setStatus(msg){ document.getElementById('status').textContent = msg; }

function loadFromStorage(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) currentData = JSON.parse(raw);
    if(currentData.items) currentData.items.forEach(it=>{ if(!it.color) it.color = detectColor(it.desc); });
  }catch(e){ /* ignore corrupt data */ }
  render();
}

function saveToStorage(data){
  currentData = data;
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    setStatus('อัปเดตข้อมูลสำเร็จ (เก็บในเบราว์เซอร์นี้)');
  }catch(e){
    setStatus('บันทึกไม่สำเร็จ: '+e.message);
  }
  render();
}

function render(){
  const items = currentData.items || [];
  document.getElementById('updatedMeta').textContent = currentData.updatedAt
    ? 'อัปเดตล่าสุด: ' + new Date(currentData.updatedAt).toLocaleString('th-TH') + (currentData.fileName? ' ('+currentData.fileName+')':'')
    : 'ยังไม่มีข้อมูล';

  const brandCounts = {};
  items.forEach(it=>{ brandCounts[it.brand] = (brandCounts[it.brand]||0) + it.qty; });
  const brands = Object.keys(brandCounts).sort((a,b)=>brandCounts[b]-brandCounts[a]);

  const brandSelect = document.getElementById('brandSelect');
  const brandOpts = [['ทั้งหมด', items.reduce((s,i)=>s+i.qty,0)], ...brands.map(b=>[b, brandCounts[b]])];
  brandSelect.innerHTML = brandOpts.map(([name,count])=> `<option value="${name}" ${name===activeBrand?'selected':''}>${name} (${count})</option>`).join('');
  brandSelect.onchange = ()=>{ activeBrand = brandSelect.value; activeColor = 'ทั้งหมด'; render(); };

  const main = document.getElementById('main');
  if(!items.length){ main.innerHTML = '<div class="empty">ยังไม่มีข้อมูลสต็อก — อัปโหลดไฟล์เพื่อเริ่มต้น</div>'; document.getElementById('colorsRow').innerHTML=''; return; }

  const byBrand = activeBrand==='ทั้งหมด' ? items : items.filter(i=>i.brand===activeBrand);

  const colorCounts = {};
  byBrand.forEach(it=>{ const cn = it.color ? it.color.name : 'ไม่ระบุ'; colorCounts[cn] = (colorCounts[cn]||0) + it.qty; });
  const colorNames = Object.keys(colorCounts).sort((a,b)=>colorCounts[b]-colorCounts[a]);
  const colorsRow = document.getElementById('colorsRow');
  colorsRow.innerHTML = '';
  if(colorNames.length > 1){
    colorsRow.appendChild(mkChip('ทั้งหมด', byBrand.reduce((s,i)=>s+i.qty,0), activeColor==='ทั้งหมด', ()=>{ activeColor='ทั้งหมด'; render(); }, null));
    colorNames.forEach(cn=>{
      const hex = (byBrand.find(i=> (i.color? i.color.name : 'ไม่ระบุ')===cn) || {}).color;
      colorsRow.appendChild(mkChip(cn, colorCounts[cn], cn===activeColor, ()=>{ activeColor=cn; render(); }, hex ? hex.hex : null));
    });
  }

  let shown = activeColor==='ทั้งหมด' ? byBrand : byBrand.filter(i=> (i.color? i.color.name:'ไม่ระบุ')===activeColor);
  if(searchTerm.trim()){
    const q = searchTerm.trim().toLowerCase();
    shown = shown.filter(i=> i.desc.toLowerCase().includes(q));
  }
  const byCat = {};
  shown.forEach(it=>{ (byCat[it.category]=byCat[it.category]||[]).push(it); });

  main.innerHTML = Object.keys(byCat).map(cat => `
    <div class="cat">${cat} (${byCat[cat].reduce((s,i)=>s+i.qty,0)})</div>
    ${byCat[cat].map(it=>`
      <div class="item">
        <div><div class="d">${it.color?`<span class="swatch" style="background:${it.color.hex}"></span>`:''}${it.desc}</div><div class="c">${it.code} • สาขา ${it.branch ?? '-'}</div></div>
        <div class="q">${it.qty}</div>
      </div>`).join('')}
  `).join('') || '<div class="empty">ไม่พบสินค้าในหมวดนี้</div>';
}

function mkChip(name, count, isActive, onClick, hex){
  const el = document.createElement('div');
  el.className = 'chip' + (isActive ? ' active':'');
  el.innerHTML = (hex ? `<span class="swatch" style="background:${hex}"></span>`:'') + name + ' (' + count + ')';
  el.onclick = onClick;
  return el;
}

document.getElementById('file').addEventListener('change', async (e)=>{
  const f = e.target.files[0];
  if(!f) return;
  setStatus('กำลังอ่านไฟล์…');
  try{
    const buf = await f.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    const items = parseWorkbook(wb);
    if(!items.length){ setStatus('อ่านไฟล์ไม่พบข้อมูลสินค้า ตรวจรูปแบบไฟล์อีกครั้ง'); return; }
    saveToStorage({ items, updatedAt: new Date().toISOString(), fileName: f.name });
  }catch(err){ setStatus('อ่านไฟล์ผิดพลาด: '+err.message); }
});

document.getElementById('clearBtn').addEventListener('click', ()=>{
  if(confirm('ล้างข้อมูลสต็อกทั้งหมดในเบราว์เซอร์นี้?')){
    localStorage.removeItem(STORAGE_KEY);
    currentData = { items: [], updatedAt: null, fileName: null };
    activeBrand = 'ทั้งหมด';
    setStatus('ล้างข้อมูลแล้ว');
    render();
  }
});

document.getElementById('searchInput').addEventListener('input', (e)=>{ searchTerm = e.target.value; render(); });

loadFromStorage();
</script>
</body>
</html>
